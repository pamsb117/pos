 appt:function(d){var p=prod(Number(d.productId));if(!p)return;S.appointments.push({id:S.seq++,clientId:Number(d.clientId),staffId:d.staffId?Number(d.staffId):null,productId:p.id,serviceName:p.name,price:p.price,duration:p.duration||30,date:d.date,time:d.time,status:'confirmed',notes:d.notes.trim()});ui.date=d.date;closeModal();commit('Cita agendada')},
 cancel:function(d){var t=ticketBy(ui.ticket)||S.tickets[0];if(t){t.status='cancelled';t.cancelReason=d.reason.trim()}closeModal();commit('Ticket cancelado')},
 config:function(d){var b=S.biz;b.name=d.name.trim()||b.name;b.tagline=d.tagline.trim();b.rfc=d.rfc.trim().toUpperCase();b.footer=d.footer.trim();b.modules.agenda=d.agenda==='on';commit('Configuracion guardada')},
 confirm:function(){var fn=pendingConfirm;closeModal();if(fn)fn()}
};

function charge(){var items=cartItems();if(!items.length)return;if(!S.cash.open){toast('Abre la caja antes de cobrar');return}
 var c=find(S.clients,Number(ui.clientId)),t=totals();
 var ticket={folio:'A-'+String(S.folio++).padStart(4,'0'),clientId:c?c.id:null,client:c?c.name:'Venta mostrador',staffId:ui.staffId?Number(ui.staffId):null,payment:ui.payment,date:today(),time:nowTime(),status:'paid',shiftId:S.cash.shiftId,items:items.map(function(x){return{name:x.name,qty:x.qty,price:x.price}}),totals:t};
 S.tickets.unshift(ticket);if(c)c.lastVisit=today();
 var a=find(S.appointments,ui.apptId);if(a)a.status='completed';
 S.cart=[];ui.clientId='';ui.staffId='';ui.apptId=null;ui.discount=0;ui.tip=0;ui.ticket=ticket.folio;ui.view='tickets';
 commit(ticket.folio+' cobrado: '+money(t.total));
}
var ACTIONS={
 nav:function(el){ui.view=el.dataset.view;render();window.scrollTo(0,0)},
 logout:function(){try{sessionStorage.removeItem('pos-salon-auth')}catch(e){}$('#app').style.display='none';$('#login').style.display='';$('#login-pass').value=''},
 'modal-close':closeModal,
 'appt-new':MODALS.appt,
 'appt-receive':function(el,id){var a=find(S.appointments,id);if(a){a.status='in_service';commit('Cita en servicio')}},
 'appt-cancel':function(el,id){var a=find(S.appointments,id);if(a)confirmModal('Cancelar cita','La cita de las '+a.time+' se marcara como cancelada.','Cancelar cita',function(){a.status='cancelled';commit('Cita cancelada')})},
 'appt-charge':function(el,id){var a=find(S.appointments,id);if(!a)return;S.cart=prod(a.productId)?[{id:a.productId,qty:1}]:[];ui.clientId=a.clientId||'';ui.staffId=a.staffId||'';ui.apptId=a.id;ui.view='cobro';commit('Cobro preparado')},
 cat:function(el){ui.category=el.dataset.cat;render()},
 add:function(el,id){var c=find(S.cart,id);if(c)c.qty++;else S.cart.push({id:id,qty:1});save();render();var row=document.querySelector('[data-cart="'+id+'"]');if(row)row.classList.add('added')},
 qty:function(el,id){var c=find(S.cart,id);if(!c)return;c.qty+=Number(el.dataset.d);if(c.qty<=0)S.cart=S.cart.filter(function(x){return x.id!==id});save();render()},
 'cart-clear':function(){S.cart=[];ui.apptId=null;save();render()},
 pay:function(el){ui.payment=el.dataset.pay;render()},
 charge:charge,
 'client-new':MODALS.client,
 'prod-new':MODALS.product,
 'prod-del':function(el,id){var p=prod(id);if(p)confirmModal('Eliminar concepto','"'+p.name+'" dejara de aparecer en el catalogo y en el punto de venta.','Eliminar',function(){S.products=S.products.filter(function(x){return x.id!==id});S.cart=S.cart.filter(function(x){return x.id!==id});commit('Concepto eliminado')})},
 'staff-new':MODALS.staff,
 'mov-add':function(){var reason=$('#mov-reason').value.trim(),amount=Math.round(Number($('#mov-amount').value));if(!reason||!(amount>0)){toast('Escribe el motivo y un importe mayor a cero');return}S.cash.movements.push({id:S.seq++,type:$('#mov-type').value,reason:reason,amount:amount,time:nowTime()});commit('Movimiento registrado')},
 'cash-close':function(){var v=$('#close-amount').value;if(v===''){toast('Escribe el efectivo contado');return}var counted=Math.round(Number(v)),s=cashSummary();confirmModal('Cerrar caja','Esperado '+money(s.expected)+', contado '+money(counted)+'. Ya no se podra cobrar hasta abrir un nuevo turno.','Cerrar caja',function(){S.cash.open=false;S.cash.lastClose={expected:s.expected,counted:counted,diff:counted-s.expected};commit('Caja cerrada')})},
 'cash-open':function(){var v=Math.max(0,Math.round(Number($('#open-amount').value)||0));S.cash={open:true,shiftId:(S.cash.shiftId||0)+1,cashier:'Recepcion',opening:v,movements:[]};commit('Caja abierta con '+money(v))},
 'ticket-select':function(el){ui.ticket=el.dataset.folio;render()},
 'ticket-print':function(){var t=ticketBy(ui.ticket)||S.tickets[0];if(!t)return;$('#print-area').innerHTML=receiptHtml(t);window.print()},
 'ticket-cancel':function(){var t=ticketBy(ui.ticket)||S.tickets[0];if(t){ui.ticket=t.folio;MODALS.cancel()}},
 'giro-apply':function(){var k=$('#giro-select').value,g=GIROS[k];confirmModal('Aplicar giro','Se cargaran datos de ejemplo de "'+g.label+'" y se reemplazaran los actuales.','Aplicar giro',function(){var b=S.biz;S=seed(k,{name:b.name,tagline:g.tagline,rfc:b.rfc,footer:b.footer,modules:{agenda:g.agenda}});ui.category='Todo';ui.ticket=null;ui.date=today();ui.view='config';commit('Giro aplicado: '+g.label)})},
 'demo-reset':function(){confirmModal('Restablecer demo','Se borrara todo lo registrado en este navegador y se volvera a los datos iniciales.','Restablecer',function(){S=seed('salon');ui.category='Todo';ui.ticket=null;ui.date=today();ui.view='config';commit('Demo restablecida')})}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-action]');if(!el||el.disabled)return;var fn=ACTIONS[el.dataset.action];if(fn)fn(el,Number(el.dataset.id))});
document.addEventListener('submit',function(e){var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();var d={};new FormData(f).forEach(function(v,k){d[k]=String(v)});var fn=FORMS[f.dataset.form];if(fn)fn(d)});
document.addEventListener('input',function(e){var id=e.target.id;
 if(id==='sale-discount'||id==='sale-tip'){if(id==='sale-discount')ui.discount=Number(e.target.value);else ui.tip=Number(e.target.value);e.target.closest('.field').querySelector('span').textContent=(id==='sale-discount'?'Descuento ':'Propina ')+e.target.value+'%';$('#sale-totals').innerHTML=totalsHtml();$('#sale-charge').textContent='Cobrar '+money(totals().total)}
 else if(id==='client-search'){ui.q=e.target.value;$('#client-list').innerHTML=clientRows()}});
document.addEventListener('change',function(e){var id=e.target.id;
 if(id==='sale-client')ui.clientId=e.target.value;
 else if(id==='sale-staff')ui.staffId=e.target.value;
 else if(id==='agenda-date'&&e.target.value){ui.date=e.target.value;render()}
 else if(id==='prod-type'){var f=$('#svc-fields');if(f)f.style.display=e.target.value==='service'?'':'none'}});
$('#modal').addEventListener('mousedown',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#modal').classList.contains('open'))closeModal()});

function enterApp(){$('#login').style.display='none';$('#app').style.display='';lastView=null;render()}
applyBrand();
var authed=false;try{authed=sessionStorage.getItem('pos-salon-auth')==='1'}catch(e){}
if(authed)enterApp();
$('#login-form').addEventListener('submit',function(e){e.preventDefault();var err=$('#login-error');if($('#login-user').value==='Prueba'&&$('#login-pass').value==='22556'){err.style.display='none';try{sessionStorage.setItem('pos-salon-auth','1')}catch(x){}enterApp()}else{err.style.display='block'}});
})();
</script>
</body></html>
